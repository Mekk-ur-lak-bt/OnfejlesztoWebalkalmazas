<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dashboard for tracking daily quests and statistics."
    />
    <title>Dream Team | Dashboard</title>
    <link rel="stylesheet" href="css/main.css?v=2" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/img/favicon/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/img/favicon/favicon-32x32.png"
    />
    <link
      rel="shortcut icon"
      href="/img/favicon/favicon.ico"
      type="image/x-icon"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/img/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="./img/favicon/site.webmanifest" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete,edit,landscape_2_edit"
    />
    <script type="module" src="js/index.js"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://mekk-ur-lak-bt.github.io/OnfejlesztoWebalkalmazas/frontend/index.html",
            "url": "https://mekk-ur-lak-bt.github.io/OnfejlesztoWebalkalmazas/frontend/index.html",
            "name": "Dream Team Tracker",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Windows, macOS, Linux",
            "description": "A personal daily quest and statistics tracker dashboard. Run the backend locally for full data persistence.",
            "browserRequirements": "Requires JavaScript. Requires HTML5. LocalStorage enabled.",
            "requirements": "Node.js backend environment for local hosting."
          },
          {
            "@type": "SoftwareSourceCode",
            "name": "Dream Team Tracker Source Code",
            "codeRepository": "https://github.com/Mekk-ur-lak-bt/OnfejlesztoWebalkalmazas",
            "programmingLanguage": {
              "@type": "ComputerLanguage",
              "name": "JavaScript"
            },
            "runtimePlatform": "Browser",
            "author": {
              "@type": "Organization",
              "name": "Mekk úr lak bt.",
              "url": "https://github.com/Mekk-ur-lak-bt"
            },
            "contributor": [
              {
                "@type": "Person",
                "name": "Fruzsina Anna Huszár",
                "url": "https://github.com/FruHuszar"
              },
              {
                "@type": "Person",
                "name": "Levente Roland Horváth",
                "url": "https://github.com/hrvthlevi"
              },
              {
                "@type": "Person",
                "name": "Vanda Alina Harnos",
                "url": "https://github.com/harnosvandaalina"
              }
            ]
          }
        ]
      }
    </script>
  </head>

  <body>
    <main>
      <div class="oszlop-bal">
        <details open class="profil-oldalsav">
          <summary id="profil-nev">
            <span role="heading" aria-level="2">Guest</span>
          </summary>
          <header>
            <img
              id="profil-avatar"
              src="img/avatar.jpg"
              alt="Guest's profile picture"
            />
            <div class="szint-sav">
              <p id="profil-szint">LVL 1 EXPLORER</p>
              <progress
                id="profil-progress"
                class="haladasi-sav"
                value="0"
                max="100"
              ></progress>
            </div>
            <div class="erme-szamlalo">
              <span aria-hidden="true">✧</span><span id="profil-coin">0</span>
            </div>
          </header>
        </details>

        <details open class="naptar-oldalsav">
          <summary>
            <span role="heading" aria-level="2">Calendar</span>
          </summary>
          <div class="naptar"></div>
        </details>
      </div>

      <div class="fo-tartalom oszlop-kozep">
        <h1>Dream Team Tracker Dashboard</h1>
        <details open class="grafikon-kartya">
          <summary>
            <span role="heading" aria-level="2">Skillset RadarChart</span>
          </summary>
          <div class="chart">
            <svg class="radar-diagram" viewBox="0 0 100 100">
              <polygon
                class="radar-halo"
                points="50,5 95,38 78,90 22,90 5,38"
              />
              <polygon
                class="radar-halo"
                points="50,20 80,42 68,75 32,75 20,42"
              />
              <polygon
                class="radar-halo"
                points="50,35 65,46 59,61 41,61 35,46"
              />
              <polygon
                class="radar-terulet"
                points="50,15 85,38 70,80 30,75 15,45"
              />
            </svg>
            <span class="cimke logic">LOGIC</span>
            <span class="cimke creativity">CREATIVITY</span>
            <span class="cimke health">HEALTH</span>
            <span class="cimke social">SOCIAL</span>
            <span class="cimke soul">SOUL</span>
          </div>
        </details>

        <div class="statisztika-racs">
          <details open class="mini-kartya">
            <summary>
              <span role="heading" aria-level="2">DAY STREAK</span>
            </summary>
            <p>12 Days</p>
          </details>
          <details open class="mini-kartya">
            <summary>
              <span role="heading" aria-level="2">ACHIEVEMENTS</span>
            </summary>
            <p>24 / 100</p>
          </details>
          <details open class="mini-kartya">
            <summary>
              <span role="heading" aria-level="2">RANK</span>
            </summary>
            <p>Top 5%</p>
          </details>
        </div>
      </div>

      <div class="utvonal-szekcio oszlop-jobb">
        <nav class="bejelentkez-menu">
          <ul>
            <li id="regisztracio-li">
              <button id="regisztracio-link">Registration</button>
            </li>
            <li id="bejelentkezes-li">
              <button id="bejelentkezes-link">Login</button>
            </li>
            <li id="kijelentkezes-li" class="hidden">
              <button id="kijelentkezes-link">Log out</button>
            </li>
            <li>
              <button aria-label="Settings" id="beallitasok">
                <span class="material-symbols-outlined">
                  landscape_2_edit
                </span>
              </button>
            </li>
          </ul>
        </nav>

        <details open class="todo-oldalsav">
          <summary>
            <span role="heading" aria-level="2">Daily Path</span>
          </summary>
          <header>
            <nav class="oldalso-menu">
              <ul>
                <li><button>Todo</button></li>
                <li><button>Calendar</button></li>
                <li><button>Achi</button></li>
              </ul>
            </nav>
          </header>

          <article class="todo">
            <h2>Daily tasks</h2>
            <button id="uj-feladat-gomb" aria-label="Add New Quest">
              + New Quest
            </button>
            <ul class="feladat-lista"></ul>
          </article>
          <article class="naptar-article hidden">
            <h2>Calendar</h2>
            <div class="naptar" id="naptar-lista"></div>
          </article>
          <article class="achievements hidden">
            <h2>Achievements</h2>
          </article>
        </details>
      </div>
    </main>

    <div id="modal-hatter"></div>
  </body>
</html>
