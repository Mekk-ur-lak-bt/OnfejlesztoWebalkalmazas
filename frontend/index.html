<!--MODAL-okat és egyéb generált kódokat majd szedjük ki a html-ből. Minél kevesebb kód maradjon itt.-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dashboard for tracking daily quests and statistics."
    />
    <title>Dream Team | Dashboard</title>
    <link rel="stylesheet" href="css/main.css?v=2" />
    <script type="module" src="js/index.js"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete,edit,landscape_2_edit"
    />
  </head>

  <body>
    <main>
      <section class="oszlop-bal">
        <details open class="profil-oldalsav">
          <summary id="profil-nev">Vendég</summary>
          <header>
            <img
              id="profil-avatar"
              src="img/avatar.jpg"
              alt="Vendég avatarja"
            />
            <div class="szint-sav">
              <p id="profil-szint">LVL 1 EXPLORER</p>
              <progress
                id="profil-progress"
                class="haladasi-sav"
                value="0"
                max="100"
              ></progress>
            </div>
            <div class="erme-szamlalo">
              <span>✧</span><span id="profil-coin">0</span>
            </div>
          </header>
        </details>

        <details open class="naptar-oldalsav">
          <summary>Naptár</summary>
          <div class="naptar"></div>
        </details>
      </section>

      <section class="fo-tartalom oszlop-kozep">
        <h1>Dream Team Tracker Dashboard</h1>
        <details open class="grafikon-kartya">
          <summary>Skillset RadarChart</summary>
          <div class="chart">
            <svg class="radar-diagram" viewBox="0 0 100 100">
              <polygon
                class="radar-halo"
                points="50,5 95,38 78,90 22,90 5,38"
              />
              <polygon
                class="radar-halo"
                points="50,20 80,42 68,75 32,75 20,42"
              />
              <polygon
                class="radar-halo"
                points="50,35 65,46 59,61 41,61 35,46"
              />
              <polygon
                class="radar-terulet"
                points="50,15 85,38 70,80 30,75 15,45"
              />
            </svg>
            <span class="cimke logic">LOGIC</span>
            <span class="cimke creativity">CREATIVITY</span>
            <span class="cimke health">HEALTH</span>
            <span class="cimke social">SOCIAL</span>
            <span class="cimke soul">SOUL</span>
          </div>
        </details>

        <div class="statisztika-racs">
          <details open class="mini-kartya">
            <summary>DAY STREAK</summary>
            <p>12 Days</p>
          </details>
          <details open class="mini-kartya">
            <summary>ACHIEVEMENTS</summary>
            <p>24 / 100</p>
          </details>
          <details open class="mini-kartya">
            <summary>RANK</summary>
            <p>Top 5%</p>
          </details>
        </div>
      </section>

      <section class="utvonal-szekcio oszlop-jobb">
        <nav class="bejelentkez-menu">
          <ul>
            <li id="regisztracio-li">
              <a href="#" id="regisztracio-link">Registration</a>
            </li>
            <li id="bejelentkezes-li">
              <a href="#" id="bejelentkezes-link">Login</a>
            </li>
            <li id="kijelentkezes-li" class="hidden">
              <a href="#" id="kijelentkezes-link">Log out</a>
            </li>
            <li>
              <a href="#" aria-label="Settings">
                <span class="material-symbols-outlined">
                  landscape_2_edit
                </span>
              </a>
            </li>
          </ul>
        </nav>

        <details open class="todo-oldalsav">
          <summary>Daily Path</summary>
          <header>
            <nav class="oldalso-menu">
              <ul>
                <li><a href="">Todo</a></li>
                <li><a href="">Naptár</a></li>
                <li><a href="">Achi</a></li>
              </ul>
            </nav>
          </header>

          <article class="todo">
            <button id="uj-feladat-gomb" aria-label="Add New Quest">
              + New Quest
            </button>
            <ul class="feladat-lista"></ul>
          </article>
          <article class="naptar-article hidden">
            <div class="naptar" id="naptar-lista"></div>
          </article>
          <article class="achievements hidden"></article>
        </details>
      </section>
    </main>

    <div id="modal-hatter"></div>
    <dialog id="feladat-modal">
      <form method="dialog" id="feladat-urlap">
        <h3 id="modal-cim">Add New Quest</h3>

        <input type="hidden" id="feladat-id" />

        <label for="urlap-cim">Quest Title:</label>
        <input type="text" id="urlap-cim" required />

        <label for="urlap-kategoria">Category:</label>
        <select id="urlap-kategoria" required>
          <option value="Logic">Logic</option>
          <option value="Aesthetics">Aesthetics</option>
          <option value="Fitness">Fitness</option>
        </select>

        <label for="urlap-xp">XP Reward:</label>
        <input type="number" id="urlap-xp" min="0" required />

        <label for="urlap-coin">Coin Reward:</label>
        <input type="number" id="urlap-coin" min="0" required />

        <label for="urlap-pont">Category Points:</label>
        <input type="number" id="urlap-pont" min="0" required />

        <label for="urlap-hatarido">Deadline:</label>
        <input type="date" id="urlap-hatarido" />

        <div class="modal-gombok">
          <button type="button" id="modal-megse">Cancel</button>
          <button type="submit" id="modal-mentes">Save</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
